name: Enforce PR Source Branch

on:
  pull_request:
    branches:
      - prod

jobs:
  check-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        run: |
          if [ "${{ github.head_ref }}" != "staging" ]; then
            echo "::error::PRs to prod must come from staging, not ${{ github.head_ref }}"
            exit 1
          fi
