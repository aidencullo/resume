name: Build Resume DOC

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pandoc and LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer

      - name: Convert LaTeX to DOCX
        run: pandoc resume.tex -o resume.docx

      - name: Convert DOCX to DOC
        run: libreoffice --headless --convert-to doc:"MS Word 97" --outdir . resume.docx

      - name: Upload DOC artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-doc
          path: resume.doc

  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download DOC artifact
        uses: actions/download-artifact@v4
        with:
          name: resume-doc

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Resume
          files: resume.doc
          make_latest: true
