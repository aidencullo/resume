<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resume</title>
    <style>
      :root {
        --bg-1: #0f172a;
        --bg-2: #0b3b2e;
        --panel: #f7f4eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 20% 20%, rgba(34, 197, 94, 0.2), transparent 45%),
          radial-gradient(circle at 80% 70%, rgba(251, 191, 36, 0.2), transparent 40%),
          linear-gradient(140deg, var(--bg-1), var(--bg-2));
      }

      .links {
        position: fixed;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        display: flex;
        gap: 16px;
        padding: 10px 14px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.68);
        backdrop-filter: blur(6px);
      }

      .links a {
        color: #e2e8f0;
        text-decoration: none;
        font: 600 14px/1.2 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        transition: color 160ms ease;
      }

      .links a:hover {
        color: #facc15;
      }

      .scene {
        width: min(84vw, 920px);
        height: min(90vh, 1180px);
        perspective: 2000px;
      }

      .card {
        width: 100%;
        height: 100%;
        border-radius: 16px;
        overflow: hidden;
        background: var(--panel);
        box-shadow: 0 28px 72px rgba(0, 0, 0, 0.45);
        transform-style: preserve-3d;
        animation: y-flip 12s linear infinite;
        will-change: transform;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        background: white;
      }

      @keyframes y-flip {
        from {
          transform: rotateY(0deg);
        }
        to {
          transform: rotateY(360deg);
        }
      }

      @media (max-width: 768px) {
        .scene {
          width: 95vw;
          height: 88vh;
        }
      }
    </style>
  </head>
  <body>
    <nav class="links" aria-label="Resume links">
      <a href="./resume.pdf" target="_blank" rel="noreferrer">PDF</a>
      <a href="https://aidencullo.com" target="_blank" rel="noreferrer">Website</a>
      <a href="https://www.linkedin.com/in/aidencullo" target="_blank" rel="noreferrer">LinkedIn</a>
    </nav>
    <main class="scene">
      <section class="card">
        <iframe src="./resume.pdf" title="Resume PDF"></iframe>
      </section>
    </main>
  </body>
</html>
